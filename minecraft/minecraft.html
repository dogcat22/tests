    <script type="text/javascript">
    // Focus handling code
    window.addEventListener('load', function() {
        setTimeout(function() {
            const gameFrame = document.getElementById('game_frame');
            if(gameFrame) {
                // Create focus prompt
                const overlay = document.createElement('div');
                overlay.className = 'focus-overlay';
                overlay.innerHTML = 'Click here to enable keyboard controls';
                overlay.onclick = function() {
                    gameFrame.focus();
                    gameFrame.click();
                    document.body.removeChild(overlay);
                    // Also add keyboard event listeners
                    gameFrame.setAttribute('tabindex', '0');
                    gameFrame.style.outline = 'none';
                };
                document.body.appendChild(overlay);
                
                // Additional focus attempts
                gameFrame.setAttribute('tabindex', '-1');
                gameFrame.focus();
            }
        }, 3000); // Wait for game to load
    });
    </script>
